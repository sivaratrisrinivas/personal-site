cv:
  name: Srinivas Sivaratri
  headline: AI Engineer | LLM Evaluation, Agent Reliability, Developer Tools
  location: Remote, India (IST, UTC+5:30)
  email: srinivassivaratri1122@gmail.com
  website: https://srinivassivaratri.is-a.dev/
  social_networks:
    - network: LinkedIn
      username: srinivas-sivaratri-3a0a32162
    - network: GitHub
      username: sivaratrisrinivas

  sections:
    summary:
      - AI engineer with an MS in Computer Science. Builds LLM systems and the evaluations that check them, and publishes the numbers. Upstream work reviewed by better-auth and go-ethereum maintainers.

    experience:
      - company: Independent
        position: Software Engineer
        start_date: 2025-05
        end_date: present
        location: Remote
        highlights:
          - Built eight AI projects with public repos and published results, including losses to baselines.
          - Traced an email-enumeration leak in better-auth to its Have I Been Pwned plugin and proposed a request-scoped skip flag with a regression test. Maintainers adopted the approach and shipped it (PR #5998).
          - Designed "geth db truncate-freezer" for go-ethereum (PR #31351), revised across three core-maintainer review rounds to batch-process instead of holding about 15 GB in memory. The core team later built its own version.
      - company: Accenture
        position: Software Engineer
        start_date: 2021-07
        end_date: 2022-07
        location: Bangalore, Karnataka, India
        highlights:
          - Wrote a Python ETL script that automated data processing, saved 50 labor hours per month, and cut errors.
          - Implemented a GitHub Actions CI/CD pipeline.

    Projects:
      - name: '[Bouncer](https://github.com/sivaratrisrinivas/bouncer-eval)'
        date: 2025 · Evaluation
        summary: Python, OpenTelemetry
        highlights:
          - Built an eval for when an AI agent with write access to a store may issue refunds. Each case has five possible actions (ACT, REPLY, ASK, ESCALATE, ABSTAIN), and grading is deterministic with no LLM judges.
          - On 50 cases, a rules baseline had a 2.0% Unsafe Action Rate. gemma-4-31b and gpt-oss-120b both had 10.0%.
      - name: '[llmfr — LLM Flight Recorder](https://github.com/sivaratrisrinivas/llm-flight-recorder)'
        date: 2025 · Tooling
        summary: Python, Hugging Face, SQLite
        highlights:
          - Built a CLI that records a local LLM generation token by token, replays it, and names the first step where two runs diverge, so later differences are tagged as fallout. The OpenAI adapter fails closed when logprobs are missing.
          - On 30 Qwen2.5-0.5B-Instruct prompts, runs disagreed in 10 cases under sampling changes and 13 under decoding changes.
      - name: '[POSTDATED](https://github.com/sivaratrisrinivas/postdated)'
        date: 2026 · Flagship
        summary: TypeScript, Next.js, Cerebras, Vitest
        highlights:
          - Selected as one of about 150 builders from 5,000+ applications for the five-hour Push to Prod hackathon in Bengaluru.
          - Built an app that turns photos of hospital discharge paperwork into a predicted, itemized insurance rejection, with one document request or doctor question per fixable line. Kept multimodal extraction apart from deterministic policy arithmetic and a guard that blocks unsupported medical claims.
          - Added 38 tests on the money and guard paths, a 40-case extraction eval harness, and offline CI gates.
      - name: '[Bingo](https://github.com/sivaratrisrinivas/Bingo)'
        date: 2025 · Retrieval
        summary: Python, sentence-transformers, NLTK
        highlights:
          - Implemented BM25 from scratch and compared it with semantic search, Reciprocal Rank Fusion, and a cross-encoder reranker. On 10 queries over 5,000 movies, BM25 led at 0.38 Precision@5 (semantic 0.32, hybrid reranking 0.36).
      - name: '[SokoFlow](https://github.com/sivaratrisrinivas/sokoflow)'
        date: 2025 · Machine Learning
        summary: Python, PyTorch
        highlights:
          - Trained a conditional diffusion policy (CNN board encoder, Transformer denoiser) to generate Sokoban plans. Solved 15 of 240 scrambled 8x8 boards (6.2%) against 94.2% for a BFS baseline, and published the gap.
      - name: '[Threadmark and context-CI](https://github.com/sivaratrisrinivas/threadmark)'
        date: In progress
        summary: SQLite, MCP, Inspect AI
        highlights:
          - Threadmark (in progress): a coding agent that logs to SQLite and, after a crash, reconciles with the live Git tree before it writes.
          - context-CI (in progress): a CLI spec and proof testing whether one MCP tool change alters a coding agent's results (Inspect AI).

    education:
      - institution: University of Alabama at Birmingham
        area: Computer Science
        degree: MS
        start_date: 2023-08
        end_date: 2025-05
        location: Birmingham, AL, USA
      - institution: BV Raju Institute of Technology
        area: Computer Science
        degree: BS
        start_date: 2017-08
        end_date: 2021-06
        location: Medak, Telangana, India

    skills:
      - label: AI and LLM
        details: LLM and agent evaluation, guardrails and abstention, RAG, hybrid retrieval (BM25, Reciprocal Rank Fusion, cross-encoder reranking), structured extraction, multimodal models, MCP, Inspect AI, OpenTelemetry
      - label: Machine Learning
        details: PyTorch, Hugging Face Transformers, PEFT and LoRA, diffusion models, sentence-transformers
      - label: Languages
        details: Python, TypeScript, Go, JavaScript, SQL, C
      - label: Engineering
        details: FastAPI, Flask, Next.js, React, PostgreSQL, Redis, SQLite, Docker, GitHub Actions, CI/CD, pytest, Vitest

    Continuing Education:
      - label: '[Boot.dev — selected completed coursework](https://www.boot.dev/u/shallowad54)'
        details: HTTP Servers in Go, Retrieval Augmented Generation, CI/CD with GitHub Actions and Docker, Memory Management in C, SQL

design:
