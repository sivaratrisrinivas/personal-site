# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# Source for assets/srinivas-sivaratri-resume.pdf.
# Render: rendercv render resume/Srinivas_Sivaratri_Resume.yaml, then copy
# resume/rendercv_output/Srinivas_Sivaratri_Resume.pdf to assets/srinivas-sivaratri-resume.pdf
cv:
  name: Srinivas Sivaratri
  headline: AI Engineer | LLM evaluation, model debugging, developer tools
  email: srinivassivaratri1122@gmail.com
  social_networks:
    - network: LinkedIn
      username: srinivas-sivaratri-3a0a32162
    - network: GitHub
      username: sivaratrisrinivas
  website: https://srinivassivaratri.is-a.dev/
  location: Remote, India (IST, UTC+5:30)
  custom_connections:
    - fontawesome_icon: briefcase
      placeholder: Open to full-time and contract
      url:

  sections:
    summary:
      - AI engineer with an MS in Computer Science. Builds LLM systems and the evaluations that check them, and publishes the numbers, including the ones that lose to a baseline. Upstream work reviewed by better-auth and go-ethereum maintainers.

    skills:
      - label: AI and LLM
        details: LLM evaluation, RAG, hybrid retrieval (BM25, Reciprocal Rank Fusion, cross-encoder reranking), token-level tracing and replay, LoRA fine-tuning, diffusion models
      - label: Machine Learning
        details: PyTorch, Hugging Face Transformers, PEFT, sentence-transformers
      - label: Languages
        details: Python, TypeScript, Go, JavaScript, SQL, C
      - label: Engineering
        details: FastAPI, Flask, Next.js, React, Node.js, Bun, PostgreSQL, Redis, SQLite, Docker, GitHub Actions, pytest, Vitest

    experience:
      - company: Independent
        position: Software Engineer
        start_date: 2025-05
        end_date: present
        location: Remote
        highlights:
          - Traced an email-enumeration leak in better-auth to its Have I Been Pwned plugin and proposed a request-scoped skip flag with a regression test. Maintainers adopted the approach and shipped it (PR \#5998).
          - Designed "geth db truncate-freezer" for go-ethereum (PR \#31351), revised across three core-maintainer review rounds to batch-process instead of holding about 15 GB in memory. The core team later built its own version.
      - company: Accenture
        position: Software Engineer
        start_date: 2021-07
        end_date: 2022-07
        location: Bangalore, India
        highlights:
          - Wrote a Python ETL script that automated data processing, saved 50 labor hours per month, and cut errors.
          - Implemented a GitHub Actions CI/CD pipeline.

    projects:
      - name: '[Bingo](https://github.com/sivaratrisrinivas/Bingo)'
        date: '[github.com/sivaratrisrinivas/Bingo](https://github.com/sivaratrisrinivas/Bingo)'
        summary: Python, NLTK, sentence-transformers, CLIP, Gemini
        highlights:
          - Built a command-line movie search over 5,000 films during Boot.dev's RAG course, with BM25 over an inverted index, chunked embeddings, Reciprocal Rank Fusion, cross-encoder reranking, image search, and LLM answers with citations.
          - Added an eval harness that scores every method on one golden set, rebuilds the index each run, and fails if test data drifts. On 10 queries, BM25 and RRF tied at 0.38 precision@5, semantic scored 0.32, and reranking 0.36.
      - name: '[SokoFlow](https://github.com/sivaratrisrinivas/sokoflow)'
        date: '[github.com/sivaratrisrinivas/sokoflow](https://github.com/sivaratrisrinivas/sokoflow)'
        summary: Python, PyTorch, Flask
        highlights:
          - Trained a diffusion model (CNN board encoder, Transformer denoiser) that turns random moves into Sokoban plans, served on CPU through Flask and a Hugging Face Space.
          - Solved 6.2% (15/240) of scrambled 8x8 boards against 94.2% for plain BFS search. Traced an earlier 20.8% figure to easy boards and published the correction.
      - name: '[llmfr (LLM Flight Recorder)](https://github.com/sivaratrisrinivas/llm-flight-recorder)'
        date: '[github.com/sivaratrisrinivas/llm-flight-recorder](https://github.com/sivaratrisrinivas/llm-flight-recorder)'
        summary: Python, PyTorch, Transformers, SQLite
        highlights:
          - Built a CLI that records a local LLM generation token by token, replays it, and names the first step where two runs split, tagging every later difference as fallout. The OpenAI adapter refuses to record when logprobs are missing.
          - On pinned Qwen2.5-0.5B demos, it labels a seed-only change as a sampling split at token 0 and a temperature-only change as a decoding split at token 8. Compare takes 0.151 s median on CPU.

    education:
      - institution: University of Alabama at Birmingham
        area: Computer Science
        degree: MS
        start_date: 2023-08
        end_date: 2025-05
        location: AL, USA
      - institution: BV Raju Institute of Technology
        area: Computer Science
        degree: BS
        start_date: 2017-08
        end_date: 2021-06
        location: India
      - institution: HTTP Servers in Go, RAG, CI/CD with GitHub Actions and Docker, Memory Management in C, SQL
        degree: '[Boot.dev](https://www.boot.dev/u/shallowad54)'
        area: coursework

design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    font_size:
      body: 9.5pt
      name: 24pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.15em
  header:
    space_below_name: 0.2cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.35cm
  section_titles:
    space_above: 0.34cm
    space_below: 0.18cm
  sections:
    space_between_regular_entries: 0.25cm
    space_between_text_based_entries: 0.1cm
  entries:
    date_and_location_width: 7.3cm
    highlights:
      space_above: 0.04cm
      space_between_items: 0.035cm
  templates:
    date_range: START_DATE to END_DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY | LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    normal_entry:
      main_column: "**NAME** | SUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    education_entry:
      main_column: "**DEGREE_WITH_AREA**, INSTITUTION, LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null

locale:
  language: english
  phrases:
    degree_with_area: DEGREE, AREA

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    pdf_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.pdf
    typst_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.typ
    markdown_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.md
    html_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.html
    png_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.png
