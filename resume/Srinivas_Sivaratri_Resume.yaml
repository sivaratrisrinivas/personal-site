# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# Render: rendercv render resume/Srinivas_Sivaratri_Resume.yaml, then copy
# resume/rendercv_output/Srinivas_Sivaratri_Resume.pdf to assets/srinivas-sivaratri-resume.pdf
cv:
  name: Srinivas Sivaratri
  headline: AI engineer · I build LLM tools and the evals that check them
  email: srinivassivaratri1122@gmail.com
  social_networks:
    - network: LinkedIn
      username: srinivas-sivaratri-3a0a32162
    - network: GitHub
      username: sivaratrisrinivas
  website: https://srinivassivaratri.is-a.dev/
  location: Remote, India (IST, UTC+5:30)
  custom_connections:
    - fontawesome_icon: briefcase
      placeholder: Full-time or contract, US-hours overlap, open to SF relocation with visa sponsorship
      url:

  sections:
    summary:
      - AI engineer with an MS in Computer Science. I build LLM tools, then write the eval that decides whether they work. I set the pass bar before I see the results and publish the misses, including numbers that lose to a baseline.

    skills:
      - label: AI and LLM
        details: LLM evaluation, RAG, hybrid retrieval (BM25, RRF, cross-encoder reranking), MCP tools, token-level tracing and replay, LoRA fine-tuning, diffusion models, PyTorch, Hugging Face Transformers, PEFT, sentence-transformers
      - label: Languages
        details: Python, TypeScript, Go, JavaScript, SQL, C
      - label: Engineering
        details: FastAPI, Flask, Next.js, React, Node.js, Bun, PostgreSQL, Redis, SQLite, Docker, GitHub Actions, pytest, Vitest

    experience:
      - company: Independent
        position: Software Engineer
        start_date: 2025-05
        end_date: present
        location: Remote
        highlights:
          - 'Turso: fuzzed its Postgres mode against real Postgres (26,000 queries), filed 3 new bugs (\#10700, \#10702, \#10704).'
          - 'langchain-aws: reported that ChatBedrock sent MCP image and file tool results to Anthropic as raw LangChain blocks (\#1475). A maintainer fixed it in \#1517 (merged Nov 2026). LangChain docs: merged \#7561, a note that stripe-agent-toolkit is deprecated.'
          - 'better-auth: traced an email-enumeration leak to its Have I Been Pwned plugin and opened a fix with a regression test (PR \#5973). A maintainer closed it in favour of their own fix (PR \#5998).'
          - Designed "geth db truncate-freezer" for go-ethereum (PR \#31351), revised across three core-maintainer review rounds to batch-process instead of holding about 15 GB in memory. The core team later built its own version.
      - company: Accenture
        position: Software Engineer
        start_date: 2021-07
        end_date: 2022-07
        location: Bangalore, India
        highlights:
          - Wrote a Python ETL script that automated data processing, saved 50 labor hours per month, and cut errors. Implemented a GitHub Actions CI/CD pipeline.

    projects:
      - name: '[unmaze](https://github.com/sivaratrisrinivas/unmaze)'
        date: '[live replay](https://sivaratrisrinivas.github.io/unmaze/) | [repo](https://github.com/sivaratrisrinivas/unmaze)'
        summary: Research project, solo | Python, PyTorch, NumPy
        highlights:
          - Built a diffusion model that denoises random noise into the path through a hedge maze. A 2.7M-parameter U-Net with a 50-step DDIM sampler, trained in about 50 minutes on 3 CPU threads. A strict judge accepts only one exact simple path, with no repair step.
          - Solved 4,990 of 5,000 fresh 11x11 mazes it had never seen (99.8%), then audited the number. On a maze style it never trained on it solves 66%. Retraining on mixed styles reached 88%, below the 90% bar I set before training, so I kept the original model and wrote down why.
      - name: '[Film Finder](https://github.com/sivaratrisrinivas/film-finder)'
        date: '[repo](https://github.com/sivaratrisrinivas/film-finder) | Nov 2026'
        summary: Cerebras x Kimi hackathon | Python, Kimi K3.1 Pro, MCP
        highlights:
          - A Telegram bot for "what's that movie" questions that names a film, asks one question, or says it is not sure. An MCP search tool returns real candidates and a second Kimi call checks them against the clues, so it cannot invent a film.
          - 'On 100 older r/tipofmytongue posts: right first 41%, confidently wrong 14%. On 13 posts newer than the model''s training data: 1 right, so I report both. 293 tokens/s on Cerebras vs 192 and 44 on two GPU hosts (median of 5 runs).'
      - name: '[Bingo](https://github.com/sivaratrisrinivas/Bingo)'
        date: '[repo](https://github.com/sivaratrisrinivas/Bingo)'
        summary: Python, NLTK, sentence-transformers, CLIP, Gemini
        highlights:
          - Built a command-line movie search over 5,000 films during Boot.dev's RAG course (BM25, embeddings, RRF, cross-encoder reranking, LLM answers with citations), then my own 834-query eval. Reranked RRF found the target in the top 10 91.6% of the time vs 86.3% for BM25, and plain RRF lost to BM25 alone.
          - Rewrote BM25 to score from precomputed term statistics, cutting p95 latency from 3.4 s to 5 ms.

    education:
      - institution: University of Alabama at Birmingham
        area: Computer Science
        degree: MS
        start_date: 2023-08
        end_date: 2025-05
        location: AL, USA
      - institution: BV Raju Institute of Technology
        area: Computer Science
        degree: BS
        start_date: 2017-08
        end_date: 2021-06
        location: India
      - institution: Go servers, RAG, CI/CD, C memory, SQL
        degree: '[Boot.dev](https://www.boot.dev/u/shallowad54)'
        area: coursework

design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.45in
    bottom_margin: 0.45in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    font_size:
      body: 9.5pt
      name: 24pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.15em
  header:
    space_below_name: 0.2cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.35cm
  section_titles:
    space_above: 0.34cm
    space_below: 0.18cm
  sections:
    space_between_regular_entries: 0.25cm
    space_between_text_based_entries: 0.1cm
  entries:
    date_and_location_width: 7.3cm
    highlights:
      space_above: 0.04cm
      space_between_items: 0.035cm
  templates:
    date_range: START_DATE to END_DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY | LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    normal_entry:
      main_column: "**NAME** | SUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    education_entry:
      main_column: "**DEGREE_WITH_AREA**, INSTITUTION, LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null

locale:
  language: english
  phrases:
    degree_with_area: DEGREE, AREA

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    pdf_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.pdf
    typst_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.typ
    markdown_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.md
    html_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.html
    png_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Resume.png
