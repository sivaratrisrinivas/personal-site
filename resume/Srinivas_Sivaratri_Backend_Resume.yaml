      username: srinivas-sivaratri-3a0a32162
    - network: GitHub
      username: sivaratrisrinivas
  website: https://srinivassivaratri.is-a.dev/
  location: Remote, India (IST, UTC+5:30)
  custom_connections:
    - fontawesome_icon: briefcase
      placeholder: Open to full-time and contract
      url:

  sections:
    summary:
      - 'Backend engineer with an MS in Computer Science. Builds Go and Python services on PostgreSQL, tests them against a real database, and reports measured numbers. Upstream work reviewed by better-auth and go-ethereum maintainers.'

    skills:
      - label: Languages
        details: Go, Python, TypeScript, SQL, JavaScript, C
      - label: Data
        details: PostgreSQL (sqlc, goose, keyset pagination, SKIP LOCKED work queues, row-level security), SQLite, Redis
      - label: Services
        details: net/http, REST APIs, JWT and refresh tokens, rate limiting, SSRF defenses, Bun, Elysia, Flask, FastAPI
      - label: Delivery
        details: Docker (distroless), GitHub Actions, race-detector and integration tests, gitleaks, Linux

    experience:
      - company: Independent
        position: Software Engineer
        start_date: 2025-05
        end_date: present
        location: Remote
        highlights:
          - 'Traced an email-enumeration leak in better-auth to its Have I Been Pwned plugin and proposed a request-scoped skip flag with a regression test. Maintainers adopted the approach and shipped it (PR \#5998).'
          - 'Designed "geth db truncate-freezer" for go-ethereum (PR \#31351), revised across three core-maintainer review rounds to batch-process instead of holding about 15 GB in memory. The core team later built its own version.'
      - company: Accenture
        position: Software Engineer
        start_date: 2021-07
        end_date: 2022-07
        location: Bangalore, India
        highlights:
          - 'Wrote a Python ETL script that automated data processing, saved 50 labor hours per month, and cut errors.'
          - 'Implemented a GitHub Actions CI/CD pipeline.'

    projects:
      - name: '[Chirpy](https://github.com/sivaratrisrinivas/Chirpy)'
        date: '[chirpy-slpq.onrender.com/app](https://chirpy-slpq.onrender.com/app/) | [repo](https://github.com/sivaratrisrinivas/Chirpy)'
        summary: Go, PostgreSQL, sqlc, goose, Docker, Render
        highlights:
          - 'Hardened a Go social-feed API: SQL keyset pagination with a cursor header, owner-scoped deletes, SHA-256-hashed refresh tokens, constant-time webhook key checks, per-IP login rate limits, a 1 MB body cap, server timeouts and graceful shutdown.'
          - 'Closed a static file server that exposed the whole repository, .env included. Integration tests against real PostgreSQL cover 64.2% of the server package; CI runs race tests, an sqlc drift check, a distroless Docker build and gitleaks. Live on Render with Postgres on Supabase, both free tier.'
      - name: '[Gator](https://github.com/sivaratrisrinivas/Gator)'
        date: '[github.com/sivaratrisrinivas/Gator](https://github.com/sivaratrisrinivas/Gator)'
        summary: Go, PostgreSQL, sqlc
        highlights:
          - 'Rebuilt a one-feed-per-tick RSS aggregator as a worker pool that claims due feeds with FOR UPDATE SKIP LOCKED. In tests, 4 aggregators racing over 20 feeds never claimed the same feed twice.'
          - 'Added conditional GET (ETag, Last-Modified), Atom and 13 date formats (the Go blog had been saving 0 posts), exponential backoff computed in SQL, and idempotent inserts. 40 feeds at 200 ms each: 8.26 s with 1 worker, 1.11 s with 8. Parser coverage 91.1%.'
      - name: '[Rashomon API](https://github.com/sivaratrisrinivas/Rashomon)'
        date: '[rashomon-ii0a.onrender.com](https://rashomon-ii0a.onrender.com) | [repo](https://github.com/sivaratrisrinivas/Rashomon)'
        summary: TypeScript, Bun, Elysia, Supabase, PostgreSQL, Gemini
        highlights:
          - 'Found that the API trusted a client-sent userId while holding the service-role key, so anyone could write as anyone. Moved identity to the verified session token, replaced wildcard CORS with an allowlist, and closed SSRF in URL import (DNS checks, private and metadata ranges, redirect re-checks, size and type caps).'
          - 'Wrote the missing schema with row-level security and an atomic chat-append function. Replaced Google Vision with Gemini free-tier OCR for images and PDFs: file type checked by magic bytes, retries on 429 and 5xx, key kept out of URLs. 41 API tests at about 98% line coverage replaced 16 tests that only exercised mock apps; CI, red since October 2025, is green. API runs in Docker on Render.'

    education:
