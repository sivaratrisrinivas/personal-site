    markdown_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Fullstack_Resume.md
    html_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Fullstack_Resume.html
    png_path: OUTPUT_FOLDER/Srinivas_Sivaratri_Fullstack_Resume.png
