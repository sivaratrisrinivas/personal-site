  sections:
    summary:
      - 'Full-stack engineer with an MS in Computer Science. Ships the browser, the API and the database together, and fixes the security and data bugs that sit between them. Upstream work reviewed by better-auth and go-ethereum maintainers.'

    skills:
      - label: Frontend
        details: TypeScript, React, Next.js, Tailwind CSS, vanilla JS, streaming fetch, Jest
      - label: Backend
        details: Go (net/http), Bun and Elysia, Python (Flask, FastAPI), REST APIs, auth, rate limiting
      - label: Data and realtime
        details: PostgreSQL, Supabase (Auth, Realtime, Storage, row-level security), SQLite, sqlc, goose
      - label: Delivery
        details: Docker, GitHub Actions, Render, Railway, pytest, bun test, gitleaks

    experience:
      - company: Independent
        position: Software Engineer
        start_date: 2025-05
        end_date: present
        location: Remote
        highlights:
          - 'Traced an email-enumeration leak in better-auth to its Have I Been Pwned plugin and proposed a request-scoped skip flag with a regression test. Maintainers adopted the approach and shipped it (PR \#5998).'
          - 'Designed "geth db truncate-freezer" for go-ethereum (PR \#31351), revised across three core-maintainer review rounds to batch-process instead of holding about 15 GB in memory. The core team later built its own version.'
      - company: Accenture
        position: Software Engineer
        start_date: 2021-07
        end_date: 2022-07
        location: Bangalore, India
        highlights:
          - 'Wrote a Python ETL script that automated data processing, saved 50 labor hours per month, and cut errors.'
          - 'Implemented a GitHub Actions CI/CD pipeline.'

    projects:
      - name: '[Rashomon](https://github.com/sivaratrisrinivas/Rashomon)'
        date: '[github.com/sivaratrisrinivas/Rashomon](https://github.com/sivaratrisrinivas/Rashomon)'
        summary: Next.js, TypeScript, Bun, Supabase Realtime, PostgreSQL
        highlights:
          - 'Live reading rooms: two people highlight the same passage, get matched over Supabase Realtime, and talk for five minutes; the transcript replays for later readers.'
          - 'Closed an impersonation hole (the API trusted a client-sent userId with the service-role key), wildcard CORS and SSRF in URL import; added a row-level-security schema and atomic chat appends. 34 API tests at about 98% line coverage, plus lint, Jest and a production build in CI, which had been red since October 2025.'
          - 'Fixed onboarding, which called a route that did not exist, and kept the post-login destination with a same-site-only redirect.'
      - name: '[DreamWeave](https://github.com/sivaratrisrinivas/dreamweave)'
        date: '[github.com/sivaratrisrinivas/dreamweave](https://github.com/sivaratrisrinivas/dreamweave)'
        summary: Python, Flask, SQLite, xAI, ElevenLabs, vanilla JS
        highlights:
          - 'Interactive bedtime stories with narration. Every user wrote to one shared audio file, so concurrent listeners heard each other''s stories; replaced it with per-story audio, an owner-token cookie and owner-only 404s.'
          - 'Streamed chapters to the browser, turned upstream failures into clean 502s without saving partial stories, rendered model output as text only (closing an XSS path), and added a no-key demo mode. 24 tests at 91% coverage.'
      - name: '[Chirpy](https://github.com/sivaratrisrinivas/Chirpy)'
        date: '[github.com/sivaratrisrinivas/Chirpy](https://github.com/sivaratrisrinivas/Chirpy)'
        summary: Go, PostgreSQL, sqlc, vanilla JS, Docker
        highlights:
          - 'Go API with a small browser client: keyset pagination, hashed refresh tokens, per-IP login rate limits and security headers. Closed a file server that exposed .env.'
          - 'Integration tests against real PostgreSQL (64.2% of the server package); CI runs race tests, an sqlc drift check, a distroless Docker build and gitleaks.'

