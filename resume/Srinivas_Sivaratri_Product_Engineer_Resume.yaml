design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    font_size:
      body: 9.5pt
      name: 24pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.15em
  header:
    space_below_name: 0.2cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.35cm
  section_titles:
    space_above: 0.34cm
    space_below: 0.18cm
  sections:
    space_between_regular_entries: 0.25cm
    space_between_text_based_entries: 0.1cm
  entries:
    date_and_location_width: 7.3cm
    highlights:
      space_above: 0.04cm
      space_between_items: 0.035cm
  templates:
    date_range: START_DATE to END_DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY | LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    normal_entry:
      main_column: "**NAME** | SUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    education_entry:
      main_column: "**DEGREE_WITH_AREA**, INSTITUTION, LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null

locale:
  language: english
  phrases:
