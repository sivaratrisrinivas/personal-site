<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="A short career briefing for Srinivas Sivaratri. Land the meeting, close the upstream deals, screen the reel — using only what’s already on the site." />
    <meta name="theme-color" content="#f4f0e6" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://srinivassivaratri.is-a.dev/game" />
    <meta property="og:title" content="The Book — Srinivas Sivaratri" />
    <meta property="og:description" content="Get him in the room. Don’t invent the reel. A three-act career briefing." />
    <meta property="og:image" content="https://srinivassivaratri.is-a.dev/assets/og-game.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Book — Get him in the room. Don’t invent the reel." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Book — Srinivas Sivaratri" />
    <meta name="twitter:description" content="Get him in the room. Don’t invent the reel. A three-act career briefing." />
    <meta name="twitter:image" content="https://srinivassivaratri.is-a.dev/assets/og-game.png" />
    <title>The Book — Srinivas Sivaratri</title>
    <script>
        (function () {
            var key = "theme";
            var stored = null;
            try { stored = localStorage.getItem(key); } catch (e) {}
            var theme = (stored === "dark" || stored === "light")
                ? stored
                : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.colorScheme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "dark" ? "#1b2228" : "#f4f0e6");
        })();
    </script>

    <link rel="icon" type="image/png" href="/assets/screening-mark.png" />
    <link rel="apple-touch-icon" href="/assets/screening-mark.png" />
    <link rel="canonical" href="https://srinivassivaratri.is-a.dev/game" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/game/game.css" />
</head>

<body class="game-page">
    <a class="skip-link" href="#game-stage">Skip to the briefing</a>
    <div class="cursor-orb" aria-hidden="true"></div>
    <div class="ambient-light" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand-mark" href="/" aria-label="Srinivas Sivaratri home">
            <span class="brand-initials"><img src="/assets/screening-mark.png" alt="" /></span>
            <span class="brand-name">Srinivas Sivaratri</span>
        </a>
        <div class="header-controls">
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="/">Portfolio</a>
                <a href="#dossier">Dossier</a>
            </nav>
            <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark appearance">
                <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="10" cy="10" r="3.25" />
                    <path d="M10 2.4v1.6M10 16v1.6M2.4 10H4M16 10h1.6M4.7 4.7l1.1 1.1M14.2 14.2l1.1 1.1M15.3 4.7l-1.1 1.1M5.8 14.2l-1.1 1.1" />
                </svg>
                <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true">
                    <path d="M16.2 12.4A6.4 6.4 0 0 1 7.6 3.8 6.6 6.6 0 1 0 16.2 12.4Z" />
                </svg>
                <span class="theme-toggle-text">Dark</span>
            </button>
        </div>
    </header>

    <main class="game-shell">
        <section id="game-stage" class="game-stage" aria-labelledby="scene-title">
            <div class="game-progress" aria-hidden="true"></div>
            <p class="scene-kicker"></p>
            <h1 id="scene-title"></h1>
            <p class="agent-line"></p>
            <div id="scene-body" class="scene-body"></div>
            <p class="game-feedback" aria-live="polite"></p>
            <p class="game-keys">Keys 1–3 choose · Enter confirms · about three minutes</p>
        </section>

        <aside id="dossier" class="dossier" aria-labelledby="dossier-title">
            <p class="section-label">Dossier</p>
            <h2 id="dossier-title">Unlocked</h2>
            <p class="dossier-empty">Nothing in the book yet. Land the meeting.</p>
            <div class="dossier-stack"></div>
        </aside>
    </main>

    <script src="/js/script.js"></script>
    <script src="/game/game.js"></script>
</body>

</html>
